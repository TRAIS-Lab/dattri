name: GPU Test on Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Gate: only TRAIS-Lab org members/owners or users with write access to the
  # repo may trigger GPU tests. Runs on a GitHub-hosted runner so unauthorized
  # comments never reach the self-hosted GPU machine.
  check-permission:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'run gpu test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
    - name: Check commenter permission
      id: check
      uses: actions/github-script@v7
      with:
        script: |
          const user = context.payload.comment.user.login;
          const association = context.payload.comment.author_association;
          // author_association may show CONTRIBUTOR for members whose org
          // membership is private, so also check the repo permission level.
          const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            username: user,
          });
          const allowed =
            ['OWNER', 'MEMBER'].includes(association) ||
            ['admin', 'maintain', 'write'].includes(data.permission);
          core.info(`user=${user} association=${association} permission=${data.permission} allowed=${allowed}`);
          core.setOutput('allowed', allowed ? 'true' : 'false');

  trigger-gpu-test:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true'
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Acknowledge trigger
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `GPU test triggered by @${context.payload.comment.user.login}. Running tests...`
          });

    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        ref: refs/pull/${{ github.event.issue.number }}/head

    - name: Setup environment
      run: |
        pip uninstall -y dattri
        python -m pip install --upgrade pip
        pip install -e .[test]
        pip install --no-build-isolation ".[sjlt]"
    - name: Analysing the code with pytest
      run: |
        pytest -v -m gpu test
    - name: Uninstall the package
      run: |
        pip uninstall -y dattri
    - name: Cleanup build artifacts
      run: |
        rm -rf *.egg-info

    - name: Comment results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success' 
            ? 'GPU tests passed.' 
            : 'GPU tests failed. Please check the logs.';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${message}\n\n[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
          });
